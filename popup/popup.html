<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ITMO Schedule</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="container">
      <h1>ITMO Schedule</h1>
      <div id="notOnMyItmo" class="notice" style="display:none">
        Please open my.itmo.ru in a tab and try again.
      </div>
      <div class="controls">
        <label class="checkbox">
          <input type="checkbox" id="chkSeparateByType" />
          <span>Separate by type</span>
        </label>
        
      </div>
      <div class="buttons">
        <div class="term-toggle">
          <button id="btnFall" class="toggle active">Fall</button>
          <button id="btnSpring" class="toggle">Spring</button>
        </div>
        <button id="btnDownloadAll" class="primary">Download schedule</button>
      </div>
      <div id="errorMsg" class="error" style="display:none"></div>
    </div>
    <script src="./popup.js" defer></script>
  </body>
  </html>
